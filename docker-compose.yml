services:
  postgres:
    image: postgres:16
    container_name: condly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: condly
      POSTGRES_PASSWORD: condly
      POSTGRES_DB: condly_dev
    ports:
      - "5433:5432"
    volumes:
      - condly_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d

  minio:
    image: minio/minio
    container_name: condly-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: condly
      MINIO_ROOT_PASSWORD: condly123
    volumes:
      - condly_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc
    container_name: condly-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 condly condly123 &&
        mc mb --ignore-existing local/condly-documentos &&
        printf '{\"CORSRules\":[{\"AllowedHeaders\":[\"*\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"HEAD\"],\"AllowedOrigins\":[\"*\"],\"MaxAgeSeconds\":3600}]}' | mc cors set local/condly-documentos &&
        echo 'MinIO pronto.'
      "

volumes:
  condly_postgres_data:
  condly_minio_data:
